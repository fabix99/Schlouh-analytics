# Schlouh data platform
#
# One-shot pipeline (no Airflow UI):
#   docker compose run --rm platform
#
# Airflow (SequentialExecutor, local):
#   docker compose --profile airflow up -d airflow-webserver airflow-scheduler
#   open http://localhost:8080  (admin / admin)
#   Trigger DAG: schlouh_platform_pipeline

services:
  platform:
    build:
      context: .
      dockerfile: Dockerfile.platform
    volumes:
      - ./data/warehouse:/app/data/warehouse
    environment:
      SOFASCORE_WAREHOUSE_PATH: /app/data/warehouse/schlouh.duckdb

  airflow-init:
    profiles: ["airflow"]
    build:
      context: .
      dockerfile: Dockerfile.airflow
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin --password admin \
          --firstname Schlouh --lastname Admin \
          --role Admin --email admin@example.com || true
    environment: &airflow_env
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      SCHLOUH_PROJECT_ROOT: /opt/airflow/project
      SCHLOUH_PYTHON: python
      SOFASCORE_WAREHOUSE_PATH: /opt/airflow/project/data/warehouse/schlouh.duckdb
      _PIP_ADDITIONAL_REQUIREMENTS: ""
    volumes:
      - ./platform/airflow/dags:/opt/airflow/dags
      - ./:/opt/airflow/project
      - airflow_home:/opt/airflow

  airflow-webserver:
    profiles: ["airflow"]
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: webserver
    ports:
      - "8080:8080"
    environment: *airflow_env
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - ./platform/airflow/dags:/opt/airflow/dags
      - ./:/opt/airflow/project
      - airflow_home:/opt/airflow

  airflow-scheduler:
    profiles: ["airflow"]
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler
    environment: *airflow_env
    volumes:
      - ./platform/airflow/dags:/opt/airflow/dags
      - ./:/opt/airflow/project
      - airflow_home:/opt/airflow

volumes:
  airflow_home:
