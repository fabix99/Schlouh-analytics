version: 2

sources:
  - name: raw_sofascore
    description: "Sofascore lake loaded by DLT (index + derived + processed). Core scouting tables only."
    schema: raw_sofascore
    tables:
      - name: matches
        columns:
          - name: match_id
            tests: [not_null, unique]
      - name: players
        columns:
          - name: player_id
            tests: [not_null]
      - name: player_appearances
        columns:
          - name: match_id
            tests: [not_null]
          - name: player_id
            tests: [not_null]
      - name: player_incidents
      - name: match_scores
      - name: match_scores_full
      - name: team_season_stats
      - name: match_summary
        columns:
          - name: match_id
            tests: [not_null, unique]
      - name: player_season_stats
      - name: player_career_stats
      - name: competition_benchmarks
      - name: player_percentile_ranks
      - name: player_rolling_form
      - name: player_scouting_profiles
      - name: player_progression
      - name: player_consistency
      - name: player_opponent_context_summary
      - name: team_tactical_profiles
      - name: heatmap_points
      - name: league_strength
